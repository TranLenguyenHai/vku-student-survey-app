name: Build Android APK Package

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS required by Capacitor 8)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Copy Web Assets to Android
        run: |
          node scripts/copy-web.js
          node ./node_modules/@capacitor/cli/bin/capacitor copy android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload .APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VKU_Survey_Android_APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
