name: Build iOS IPA Package

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA (.ipa)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Sync Capacitor iOS
        run: |
          npm run build
          npx cap sync ios

      - name: Build Xcode Archive (Unsigned for Sideloadly)
        run: |
          mkdir -p build
          if [ -d "ios/App/App.xcworkspace" ]; then
            BUILD_FLAG="-workspace ios/App/App.xcworkspace"
          else
            BUILD_FLAG="-project ios/App/App.xcodeproj"
          fi
          echo "Building with: $BUILD_FLAG"
          xcodebuild $BUILD_FLAG \
            -scheme App \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath "$PWD/build/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean archive

      - name: Package Payload into .IPA File
        run: |
          mkdir -p Payload
          cp -r "build/App.xcarchive/Products/Applications/App.app" Payload/
          zip -r -y "VKU_Survey_iOS.ipa" Payload
          ls -lh VKU_Survey_iOS.ipa

      - name: Upload .IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VKU_Survey_iOS_IPA
          path: VKU_Survey_iOS.ipa
          retention-days: 30
