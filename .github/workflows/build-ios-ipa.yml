name: Build iOS IPA Package

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA (.ipa)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS required by Capacitor 8)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Copy Web Assets to iOS
        run: |
          node scripts/copy-web.js
          node ./node_modules/@capacitor/cli/bin/capacitor copy ios

      - name: Build Xcode Archive (Unsigned for Sideloadly)
        run: |
          mkdir -p build
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath "$PWD/build/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean archive

      - name: Package Payload into .IPA File
        run: |
          mkdir -p Payload
          cp -r "build/App.xcarchive/Products/Applications/App.app" Payload/
          zip -r -y "VKU_Survey_iOS.ipa" Payload
          ls -lh VKU_Survey_iOS.ipa

      - name: Upload .IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VKU_Survey_iOS_IPA
          path: VKU_Survey_iOS.ipa
          retention-days: 30
